<style>:root{color-scheme:dark;--display:"Fredoka",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;--pink:#ff5fa8;--cyan:#5fd2ff;--ink:#0b0718;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#05030c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;left:50%;top:50%;width:540px;height:960px;overflow:hidden;overflow:clip;transform-origin:50% 50%;background:#05030c;font-family:var(--display);color:#fff}
canvas{display:block}
[hidden]{display:none!important}
#backdrop{position:fixed;left:0;top:0;width:100%;height:100%;filter:blur(9px);transform:scale(1.05);pointer-events:none}
#rotate{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(5,3,12,.97);color:#fff;place-items:center;text-align:center;font:700 20px/1.3 var(--display)}
#rotate svg{width:70px;height:70px;animation:turnme 1.5s ease-in-out infinite alternate}#rotate p{margin:8px 0 12px}
#rotate button{padding:11px 18px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font:600 15px var(--body)}
@media (orientation:landscape) and (pointer:coarse) and (max-height:520px){#rotate{display:grid}}
html.typing #rotate{display:none!important}
@keyframes turnme{from{transform:rotate(-90deg)}to{transform:none}}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.screen,.stage{position:absolute;top:0;right:0;bottom:0;left:0}
.screen .bg,.stage .bg{position:absolute;top:0;right:0;bottom:0;left:0}
.screen .inner{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;padding:56px 34px 40px;box-sizing:border-box;text-align:center}
.logo{margin:6px 0 0;line-height:.95;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.logo span{display:block;font-size:44px;color:#ffe36b;text-shadow:0 0 18px rgba(255,200,60,.6),0 4px 0 #b3531e;transform:rotate(-3deg)}
.logo b{display:block;font-size:96px;letter-spacing:3px;color:#fff;text-shadow:0 0 26px var(--pink),0 0 5px var(--pink),0 6px 0 #a81a63}
.logo em{display:block;margin-top:8px;font-style:normal;font-size:27px;line-height:1.1;letter-spacing:.8px;color:#fff;text-shadow:0 0 16px var(--cyan),0 0 3px var(--cyan),0 3px 0 #1671a8}
.duo{position:relative;width:540px;height:250px;margin-top:22px;flex:none}
.menu{display:flex;flex-direction:column;gap:14px;width:100%;max-width:380px;margin-top:auto}
.btn{min-height:66px;border:0;border-radius:20px;font:700 26px var(--display);color:#fff;background:linear-gradient(#3a2f66,#261d49);box-shadow:0 6px 0 #150f2c,0 0 0 2px rgba(255,255,255,.14) inset;letter-spacing:.5px}
.btn.primary{background:linear-gradient(#ff7dbb,#ff3f93);box-shadow:0 6px 0 #a81a63,0 0 24px rgba(255,95,168,.5)}
.btn.second{background:linear-gradient(#58c8ff,#2a8fe0);box-shadow:0 6px 0 #1763a6,0 0 24px rgba(95,210,255,.45);text-shadow:0 2px 0 rgba(0,40,90,.35)}
.btn.small{min-height:60px;font-size:20px;background:rgba(38,30,74,.86);box-shadow:0 0 0 2px rgba(255,255,255,.16) inset}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #150f2c}
.foot{margin:16px 0 0;font:600 17px var(--body);color:#cfc9ea;text-shadow:0 1px 3px #05030c,0 0 8px #05030c}
.title .foot{max-width:300px}
.langbtn{position:absolute;right:14px;bottom:14px;z-index:5;display:inline-flex;align-items:center;min-height:64px;border:0;border-radius:16px;background:rgba(40,32,80,.8);color:#dcd6f5;font:600 16px var(--body);padding:0 16px;box-shadow:0 0 0 2px rgba(255,255,255,.14) inset;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{margin:0 0 10px;font-size:38px;text-shadow:0 0 18px rgba(95,210,255,.6)}
h3{margin:14px 0 8px;font:600 17px var(--display);letter-spacing:2px;text-transform:uppercase;color:#a79fd0;align-self:flex-start}
.songs,.chars{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.levels{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.levels .chip{flex:1 1 84px;min-height:64px}
.diffedit .diffrows{width:100%;max-width:440px;margin:6px auto 0}
.diffrows{display:flex;flex-direction:column;gap:14px}
.diffrow{display:flex;align-items:center;gap:10px}
.diffrow>label{flex:0 0 74px;text-align:left;font:700 17px var(--display);color:#cfc9ea}
.sld{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.sld>span{font:700 15px var(--body);color:#aaa2d0;white-space:nowrap}
.sld input[type=range]{flex:1;min-width:0;height:64px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.sld input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:rgba(255,255,255,.22)}
.sld input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:rgba(255,255,255,.22)}
.sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-11px;width:32px;height:32px;border-radius:50%;background:var(--cyan);box-shadow:0 2px 7px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.3) inset}
.sld input[type=range]::-moz-range-thumb{border:0;width:32px;height:32px;border-radius:50%;background:var(--cyan);box-shadow:0 2px 7px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.3) inset}
.chip.tog{flex:1;min-height:64px;font-size:18px}
.chip.tog.mini{flex:0 0 92px}
.winmode{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.winmode .chip{flex:1 1 130px;min-height:64px}
.winnote{flex-basis:100%;margin:6px 0 0;font:600 15px var(--body);color:#9a92c0;text-align:left;min-height:20px}
.card,.chip{border:0;border-radius:18px;background:rgba(40,32,80,.82);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.14) inset;padding:14px 8px;min-height:64px;font:700 22px var(--display)}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px;justify-content:center}
.card span{font:600 15px var(--body);color:#c2bbe6}.card em{font:700 15px var(--display);font-style:normal;color:#ffe36b}
.card.off{opacity:.5;cursor:default}
.card.make{background:rgba(40,32,80,.4);box-shadow:none;border:2px dashed rgba(149,210,255,.55)}.card.make b{color:#9fe0ff}.card.make span{color:#9fe0ff}.card.make em{color:#c2bbe6;font:600 14px var(--body);text-align:center;line-height:1.3}
.card.on,.chip.on{background:linear-gradient(#5a3fb0,#3b2a86);box-shadow:0 0 0 3px var(--cyan) inset,0 0 20px rgba(95,210,255,.45)}
.card.char{min-height:150px;padding:6px}.card.char svg{width:112px;height:112px}
.rows{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:70px;padding:10px 18px;border:0;border-radius:18px;background:rgba(40,32,80,.82);color:#fff;font:600 22px var(--display);box-shadow:0 0 0 2px rgba(255,255,255,.14) inset;text-align:left;box-sizing:border-box}
.langs{display:flex;flex-direction:column;gap:10px;width:100%;max-height:640px;overflow-y:auto;padding:2px}
.langs .row.lang{min-height:58px;font:600 20px var(--display)}
.langs .row.lang.on{box-shadow:0 0 0 3px var(--cyan) inset,0 0 18px rgba(95,210,255,.4);background:linear-gradient(#5a3fb0,#3b2a86)}
.langs .row.lang b{color:var(--cyan);font-size:22px}
.row small{display:block;font:600 15px var(--body);color:#b9b2d8}.row b{color:var(--cyan)}
.row i{display:flex;align-items:center;gap:10px;font-style:normal}
.mini{width:60px;height:60px;border:0;border-radius:14px;background:#4a3d8a;color:#fff;font:700 28px var(--display)}
.how{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%}
.how li{display:flex;gap:14px;align-items:center;background:rgba(40,32,80,.82);border-radius:18px;padding:14px 16px;font:600 19px/1.3 var(--body)}
.how b{color:#ffe36b}
.how .howphase{font:700 16px var(--display);letter-spacing:1px;text-transform:uppercase;color:#9fe0ff;margin:4px 0 2px;min-height:20px}
.how .howpad{display:block;margin:2px auto;width:min(420px,96%);height:auto;touch-action:manipulation}
.how .howverdict{font:800 26px var(--display);margin:4px 0 0;min-height:32px;color:#cfc9ea}
.how .howverdict.v-perfect{color:#7dffa0}.how .howverdict.v-good{color:#5fd2ff}.how .howverdict.v-early,.how .howverdict.v-late{color:#ff6b8b}
.how .howtip{font:600 16px var(--body);color:#cfc9ea;margin:2px auto 4px;max-width:420px}
.how .how.small{gap:8px;margin:6px 0 0}.how .how.small li{padding:9px 13px;font:600 15px/1.25 var(--body)}
.howbtn .q{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--cyan);color:#06243a;font:800 16px var(--display);vertical-align:middle}
.ic{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:30px;background:#1a1438;box-shadow:0 0 0 3px var(--pink) inset}
.ic.ring{box-shadow:0 0 0 3px var(--pink) inset,0 0 0 9px rgba(255,95,168,.35)}
.ic.trap{box-shadow:0 0 0 3px #ff3d5e inset;background:#3a0614}.ic.trap::before{content:"✖";color:#ff3d5e}
.ic.bolt{box-shadow:0 0 0 3px #ffe36b inset}.ic.heart{box-shadow:0 0 0 3px #7dffa0 inset;color:#7dffa0}
.keys{font:600 17px var(--body);color:#c2bbe6;margin:14px 0 0}.keys b{color:#fff}
.rduo{position:relative;width:472px;height:150px;flex:none;margin:-6px 0 0}
.result .verdict,.result .sub{position:relative;z-index:2}
.verdict{font-size:54px;margin-top:0}.result.won .verdict{color:#ffe36b;text-shadow:0 0 24px rgba(255,210,80,.7)}.result.lost .verdict{color:#9fb3ff}
.sub{margin:0 0 14px;font:600 17px var(--body);color:#cfc9ea;text-shadow:0 1px 3px #05030c,0 0 8px #05030c}
.stats{width:100%;border-collapse:separate;border-spacing:0 6px;font:600 20px var(--display)}
.stats th{font:600 15px var(--display);color:#a79fd0;text-transform:uppercase;letter-spacing:1px;width:30%}
.stats td{background:rgba(40,32,80,.82);padding:5px 6px;width:35%}.stats td:first-child{border-radius:12px 0 0 12px}.stats td:last-child{border-radius:0 12px 12px 0}

else if (k === "how") await howScreen();      // the interactive timing lesson, straight from the menu

}
}
function duoOn(root, a, b, shadow = false) {

const iv = setInterval(() => { const p = (Math.random() * 9) | 0; ca.pose(p); setTimeout(() => cb.pose(8 - p, !shadow), 260); }, 900);
return () => { clearInterval(iv); ca.destroy(); cb.destroy(); };
}
async function multiMenu() {
const k = await screen("multi", `<h2>${T("2 Players")}</h2><div class="pickduo"></div><div class="menu"><button class="btn primary" data-k="local">${T("Same screen")}</button><button class="btn" data-k="online">${T("Online")}</button><button class="btn small" data-k="back">${T("Back")}</button></div>
<p class="foot">${TOUCH() ? (Core.wide ? T("Same screen: side by side, one player on each half of the screen.") : T("Same screen: one player at each end of the phone. Or turn it sideways first, to sit side by side.")) + " " + T("Nothing from these matches is saved.")

async function boot() {
